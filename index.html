/* Prototype controls occupy their own layout space and never cover guest content. */
.switcher{position:relative;left:auto;bottom:auto;transform:none;width:max-content;margin:12px auto;box-shadow:none}
/* 30 October: owner-selected photographic reference layout. */
:root{--deep:#30382e;--paper:#fcfaf5}
body{background:var(--paper)}
.review-banner{font-size:11px;letter-spacing:.06em;position:relative;z-index:8;padding:7px 12px;background:var(--linen)}
header{background:var(--paper)}
.header-inner{max-width:1500px;padding:24px 52px;border:0}
.home-page header{position:absolute;top:30px;left:0;right:0;background:transparent;color:var(--limestone)}
.home-page header .wordmark img{filter:brightness(0) invert(94%) sepia(10%) saturate(360%)}
.home-page .nav .nav-book{color:var(--limestone);border-color:var(--limestone)}
.home-page .lang{color:var(--limestone);border-color:#e8ddc980}
.home-page .menu{color:var(--limestone)}
.home-page header a:focus-visible,.home-page header button:focus-visible{outline-color:var(--limestone)}
.wordmark strong{font-size:27px}.nav{gap:25px;font-size:13px}
.reference-hero{position:relative;min-height:650px;display:grid;align-items:center;justify-items:center;overflow:hidden;border-radius:0 0 38px 38px;background:var(--deep);color:var(--limestone)}
.reference-hero>.hero-photo{position:absolute;width:100%;height:100%;object-fit:cover;object-position:50% 58%;inset:0}
.hero-shade{position:absolute;inset:0;background:#18201680}
.reference-hero-copy{position:relative;z-index:1;text-align:center;padding:150px 25px 110px;max-width:1040px}
.reference-hero h1{font-size:clamp(48px,5.8vw,82px);font-weight:600;letter-spacing:.01em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.reference-hero-copy p{margin:24px auto 30px;font-size:18px;color:var(--limestone)}
.hero-actions{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.hero-actions .button{min-width:175px}.button.ghost{background:transparent;border:1px solid var(--limestone);color:var(--limestone)}
.button.ghost:hover{background:#f5f0e426}.reference-hero .button:focus-visible{outline-color:var(--limestone)}
.photo-credit{position:absolute;bottom:22px;right:32px;font-size:11px;letter-spacing:.04em;background:#253021d9;color:var(--limestone);padding:5px 10px}
.section-narrow{max-width:1070px;margin:0 auto;padding:90px 40px}
.welcome{display:grid;grid-template-columns:1fr 1fr;gap:85px;align-items:center;min-height:520px}
.welcome h2,.location-story h2,.feature-row h2,.enquiry-section h2{font-size:clamp(32px,3vw,42px);font-weight:600;text-transform:uppercase;letter-spacing:.01em;line-height:1.08}
h2 span{color:var(--olive)}
.welcome p{font-size:15px;line-height:1.75;margin:20px 0;max-width:410px}
.overlap-photos{position:relative;height:350px;padding-right:22px}
.photo-button{padding:0;margin:0;background:transparent;display:block;width:100%;overflow:hidden;cursor:zoom-in;color:inherit}
.photo-button img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease-out}
.photo-button:hover img{transform:scale(1.025)}
.overlap-photos .welcome-back{position:absolute;top:0;left:0;width:68%;height:265px;border-radius:16px}
.overlap-photos .welcome-front{position:absolute;right:0;bottom:0;width:66%;height:265px;border:7px solid var(--paper);border-radius:15px}
.overlap-label{position:absolute;left:0;bottom:22px;font-size:11px;letter-spacing:.14em;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--muted)}
.home-band{padding:48px 35px 54px;background:var(--linen);text-align:center}
.home-band h2,.gallery-heading h2,.book-collection>h2{font-size:39px;text-transform:uppercase;letter-spacing:.035em;font-weight:600}
.home-band-items{max-width:920px;margin:32px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.home-band-items a{text-decoration:none;display:flex;flex-direction:column;align-items:center;padding:8px}
.home-band-items a:hover strong{text-decoration:underline;text-underline-offset:5px}
.home-band-items img{width:76px;height:76px;object-fit:contain;margin-bottom:10px}
.home-band-items strong{font-family:var(--serif);font-size:25px;font-weight:600}
.home-band-items small{font-size:12px;color:var(--muted);margin-top:4px}
.spaces{padding:72px 20px 25px;max-width:1460px;margin:auto}
.gallery-heading{text-align:center}.gallery-heading p{font-size:13px;color:var(--muted);margin:18px auto 0}
.gallery-filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:28px 0}
.gallery-filters button{background:transparent;color:var(--ink);padding:10px 16px;border:1px solid var(--line);font-size:13px;min-height:44px;border-radius:3px}
.gallery-filters button[aria-pressed=true]{background:var(--olive);color:var(--limestone);border-color:var(--olive)}
.gallery-filters button:hover{border-color:var(--olive)}
.masonry{columns:3;column-gap:12px;scroll-margin-top:15px}
.masonry-item{break-inside:avoid;margin-bottom:12px;position:relative;background:var(--linen)}
.masonry-item .photo-button{aspect-ratio:1.35}
.masonry-item.shape-1 .photo-button{aspect-ratio:.83}
.masonry-item.shape-2 .photo-button{aspect-ratio:.72}
.masonry-item.shape-3 .photo-button{aspect-ratio:1.12}
.masonry-item figcaption{position:absolute;left:12px;bottom:12px;color:var(--ink);background:var(--limestone);padding:4px 8px;font-size:11px;pointer-events:none}
.gallery-help{font-size:12px;text-align:center;color:var(--muted);margin:22px auto 0}
.location-story{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:center}
.location-story p{font-size:15px;margin:20px 0;line-height:1.75}
.location-story figure{position:relative;max-width:350px;justify-self:center;width:100%}
.location-story figure img{width:100%;height:340px;object-fit:cover;border-radius:2px}
.location-story figcaption{font-size:11px;color:var(--muted);margin-top:10px}
.quiet-note{font-size:12px!important;color:var(--muted);line-height:1.6}
.feature-stories{background:var(--deep);color:var(--limestone)}
.feature-stories>.section-narrow{padding-top:85px;padding-bottom:85px}
.feature-row{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:85px;margin-bottom:80px}
.feature-row:last-child{margin-bottom:0}.feature-row.reverse>div{order:2}.feature-row.reverse>figure{order:1}
.feature-row h2 span,.enquiry-section h2 span{color:#d0d3b2}
.feature-row p{font-size:15px;line-height:1.8;margin:20px 0;color:var(--limestone)}
.feature-row .photo-button{aspect-ratio:1;max-width:380px;border-radius:15px}
.feature-row figcaption{font-size:11px;color:#dedcc9;margin-top:10px}
.feature-row a:focus-visible,.feature-row button:focus-visible{outline-color:var(--limestone)}
.story-links{display:flex;flex-direction:column;gap:2px;align-items:start}.story-links .text-link{font-size:14px}
.feature-row .feature-note{font-size:12px;color:#dedcc9}
.pause-band{background:var(--linen);padding:78px 30px;text-align:center}
.pause-band p{font-family:var(--serif);font-size:clamp(27px,3.3vw,44px);line-height:1.15;text-transform:uppercase;letter-spacing:.02em;margin:auto;max-width:900px}
.pause-band span{color:var(--olive)}
.book-collection{max-width:1180px;padding-top:75px;padding-bottom:75px}
.book-collection>h2{text-align:center;margin-bottom:36px}
.book-collection .homes.four{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.home-image{border:0;border-radius:12px;background:var(--linen)}
.home-image img,.homes.four .home-image img{aspect-ratio:.9;object-fit:cover}
.home-info{padding-top:14px;gap:8px}.homes.four h3{font-size:23px}.home-info .arrow-link{width:33px;height:33px}.home-info p{font-size:11px}
.center-action{text-align:center;margin-top:35px}
.enquiry-section{background:var(--deep);color:var(--limestone)}
.enquiry-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:90px;padding-top:72px;padding-bottom:72px}

.webp", "alt": "Bedroom and wardrobe", "width": 856, "height": 1280, "home": "mulberry-court"}, {"src": "assets/photos/mulberry-court-11.webp", "alt": "Second bedroom", "width": 1280, "height": 848, "home": "mulberry-court"}, {"src": "assets/photos/mulberry-court-12.webp", "alt": "Bedroom and storage", "width": 1280, "height": 843, "home": "mulberry-court"}, {"src": "assets/photos/mulberry-court-13.webp", "alt": "Hallway", "width": 853, "height": 1280, "home": "mulberry-court"}, {"src": "assets/photos/mulberry-court-14.webp", "alt": "Bathroom and mirror", "width": 1280, "height": 704, "home": "mulberry-court"}, {"src": "assets/photos/mulberry-court-15.webp", "alt": "Shower", "width": 851, "height": 1280, "home": "mulberry-court"}, {"src": "assets/photos/mulberry-court-16.webp", "alt": "Bathroom basin", "width": 856, "height": 1280, "home": "mulberry-court"}, {"src": "assets/photos/mulberry-court-17.webp", "alt": "Village lane near the entrance", "width": 853, "height": 1280, "home": "mulberry-court"}]}; window.ARTICLES={"getting-to-samos": {"slug": "getting-to-samos", "title": "Getting to Samos, and on to Kokkari", "description": "Flights to Samos, ferries from Piraeus to Vathy and Karlovasi, and the transfer to Kokkari — with times, ports and what to book.", "status": "draft", "updated": "2026-10-31", "facts_verified": "2026-10-31", "translation": "pending (Greek)", "sources": ["https://www.ferryhopper.com/en/ferry-routes/direct/piraeus-samos", "https://www.getfromairport.com/samos-airport/kokkari", "https://gosamos.gr/en/samos-bus-timetable-ktel", "https://www.discovergreece.com/experiences/village-hopping-samos-mountain-coast"], "html": "<p><strong>Short answer:</strong> Fly into Samos airport (SMI) near Pythagoreio, or take a ferry from Piraeus to Vathy or Karlovasi — 8 to 11 hours. Kokkari is about 27 km from the airport and 10 km from Vathy. There is no train and no bridge; you arrive by air or sea, then continue by taxi, bus or hire car.</p>\n<h2>By air</h2>\n<p>Samos International Airport, Aristarchos of Samos (SMI), is on the south-east of the island near Pythagoreio. Athens is the year-round connection; in summer the airport also takes seasonal flights from a number of European cities. Schedules change every season, so book the flight before you book the room, and check the arrival time against the ferry timetable if you are combining the two.</p>\n<p>From the airport to Kokkari is about 27 km, roughly 35 to 40 minutes by road. A taxi is the simplest transfer; expect roughly €26 in the day and more at night, and confirm the fare with the driver before you set off. By bus you first go to Vathy and change there.</p>\n<h2>By sea</h2>\n<p>Ferries from Piraeus take 8 to 11 hours and arrive at either Vathy or Karlovasi. Blue Star Ferries and other operators run the route; the crossing is usually overnight, and a cabin turns it into a night's sleep rather than a night in a seat. One-way passenger fares started at around €49 when checked in October 2026, with cars and cabins extra.</p>\n<ul><li><strong>Vathy</strong> is the main port and the capital. From there, Kokkari is 10 km and about 16 minutes by road, with weekday buses and taxis at the quay.</li><li><strong>Karlovasi</strong> is the north-west port, a longer transfer across the island. It makes sense if your first stop is the west coast.</li></ul>\n<p>Book the ferry as soon as your dates are fixed, especially for July and August and for a car. The fast catamarans that serve other islands do not meaningfully shorten this route; the distance is the distance.</p>\n<h2>The last leg</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>From</th><th>To Kokkari</th><th>How</th><th>Notes</th></tr></thead><tbody><tr><td>Samos airport (SMI)</td><td>27 km, 35–40 min</td><td>Taxi or hire car</td><td>Bus requires a change at Vathy</td></tr><tr><td>Vathy port</td><td>10 km, 16 min</td><td>Taxi, bus or car</td><td>Weekday buses at 08:30, 09:30, 12:20, 14:00 and 17:00</td></tr><tr><td>Karlovasi port</td><td>Across the island</td><td>Car or taxi</td><td>The long way round; check the route before booking</td></tr></tbody></table></div>\n<h2>Arriving by bus</h2>\n<p>KTEL Samos runs the island buses. The Vathy to Kokkari and Tsamadou service left at 08:30, 09:30, 12:20, 14:00 and 17:00 on weekdays when checked in October 2026. Saturday and Sunday services are thinner, and the timetable changes with the season. The current timetable is posted at the KTEL office in Vathy and by phone on +30 22730 27262.</p>\n<p>The airport bus goes to Vathy, not to Kokkari. With luggage, the change is worth avoiding; take a taxi from the airport and put the bus aside for a day out.</p>\n<h2>Driving, parking and the village</h2>\n<p>If you hire a car, collect it at the airport or in Vathy. Kokkari's lanes are narrow and the waterfront fills up; park at the edge of the village and walk in. The coast road west to Lemonakia and Tsamadou has parking about 200 metres from each beach, followed by a short path.</p>\n<p>A car is not needed for a Kokkari week. It is needed for the south of the island: Pythagoreio, the Eupalinos tunnel, the Heraion and the Potami waterfalls. Hire one for two days rather than seven.</p>\n<h2>Arriving without a car</h2>\n<p>Fly to SMI, take a taxi to Kokkari, and use the bus, your feet and the occasional taxi for the week. <a href=\"?page=article&amp;slug=samos-without-a-car\" data-page=\"article\" data-slug=\"samos-without-a-car\">Samos without a car</a> sets out what that week looks like, including the days when hiring a car is worth it.</p>\n<h2>Where to stay</h2>\n<p>Mulberry Residences is in Kokkari, four individual stays within the village. <a href=\"?page=stays\" data-page=\"stays\">See the four stays</a> and <a href=\"?page=booking\" data-page=\"booking\">check dates</a>. If you are still deciding which part of the island suits you, <a href=\"?page=article&amp;slug=where-to-stay-samos\" data-page=\"article\" data-slug=\"where-to-stay-samos\">compare the bases</a>.</p>\n<p><em>Ferry times, fares and bus times checked 31 October 2026. They change by season; confirm with the operator before you book.</em></p>"}, "kokkari-beaches": {"slug": "kokkari-beaches", "title": "The beaches at Kokkari, Samos: a short guide", "description": "Kokkari's village beach, Lemonakia and Tsamadou compared — distances, pebbles, depth, facilities and how to reach each one.", "status": "draft", "updated": "2026-10-31", "facts_verified": "2026-10-31", "translation": "pending (Greek)", "sources": ["https://in-samos.com/beaches/kokkari/", "https://in-samos.com/tsamadou/", "https://in-samos.com/beaches/lemonakia/", "https://bathingwaterprofiles.gr/en/bathingprofiles/GRBW149264289"], "html": "<p><strong>Short answer:</strong> Kokkari has three swimming beaches within 2 km. The village beach is the longest and the most convenient. Lemonakia, 1.7 km west, has the gentlest entry. Tsamadou, 2 km west, is the largest, the calmest in a north wind, and has the steepest drop into deep water.</p>\n<p>Kokkari's beaches are pebble, not sand, and the water gets deep quickly. Bring shoes you can swim in.</p>\n<h2>Kokkari beach</h2>\n<p>The village beach runs for about 900 metres along the bay, with tavernas and cafés a few steps behind it. Sunbeds and umbrellas are laid out in season, and there are showers and changing rooms. The sea is deep close to shore and usually has some wave; the steady northern wind is why the bay is a windsurfing base rather than a paddling beach.</p>\n<p>Staying in the village means this is your morning swim: no car, no parking, no plan. It is at its best early, before the wind builds and the waterfront fills.</p>\n<h2>Lemonakia</h2>\n<p>Lemonakia is 1.7 km west of the village, a 250-metre pebble beach in an open bay ringed by pines. The entry is gentler than at the other two, which makes it the beach to choose if you want to stand up in the water rather than dive into it. There is a restaurant, sunbeds and umbrellas, and showers and changing rooms.</p>\n<p>Park about 200 metres before the beach and walk down the short path. In July and August the small car park fills early.</p>\n<h2>Tsamadou</h2>\n<p>Tsamadou is 2 km west of the village and the largest of the three at about 400 metres. Pines and olives come down to the shore, the bay's shape keeps the water mostly calm even when the northern wind blows, and the sea is cold, clear and deep, with a steep drop and a rocky, pebbly floor.</p>\n<p>The beach is organised: sunbeds, umbrellas, tavernas and bars, showers, changing rooms, free parking about 200 metres away, then a path with steps down to the shore. The eastern side of the beach is the island's official nudist section. It is crowded in high season and parking is the bottleneck; go early or go late.</p>\n<h2>At a glance</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Beach</th><th>Distance from the village</th><th>Length</th><th>Shore and entry</th><th>Facilities</th><th>Best for</th></tr></thead><tbody><tr><td>Kokkari</td><td>In the village</td><td>900 m</td><td>Pebble, deep close in, some wave</td><td>Sunbeds, tavernas, showers, changing rooms</td><td>A swim without a plan</td></tr><tr><td>Lemonakia</td><td>1.7 km west</td><td>250 m</td><td>Pebble, gentle slope</td><td>Restaurant, sunbeds, showers, changing rooms</td><td>Standing in the water, families with older children</td></tr><tr><td>Tsamadou</td><td>2 km west</td><td>400 m</td><td>Pebble, steep drop, deep</td><td>Tavernas, bars, sunbeds, showers, changing rooms</td><td>Calm water in a north wind, an afternoon, sunset</td></tr></tbody></table></div>\n<h2>What to bring</h2>\n<ul><li><strong>Water shoes.</strong> All three beaches are pebble, in and out of the water. This is the single most useful thing in your bag.</li><li><strong>Cash and a card.</strong> Beach bars take both, but signal and queues vary.</li><li><strong>Wind protection.</strong> The northern wind is what keeps Kokkari comfortable in August. It also moves umbrellas and sand-free picnics.</li><li><strong>Water.</strong> Shade is limited outside the organised sections.</li></ul>\n<h2>Wind, waves and the season</h2>\n<p>The Meltemi blows from the north through July and August, strongest in the afternoon. Mornings are calmer at all three beaches. In June and September the wind is lighter and the sea is warmer than in May; September is the best swimming month for most people, with the water around 23.5°C.</p>\n<p>The village beach and Tsamadou take more wind; Lemonakia's bay is more open but its entry stays gentle. None of the three is a flat-calm, sandy-bottomed swimming beach in the way a southern bay can be.</p>\n<h2>Getting there</h2>\n<p>Lemonakia and Tsamadou are on the coast road west of the village. The KTEL bus from Vathy to Kokkari and Tsamadou stops along it; taxis will take you and come back for a fixed time if you ask. By car, park 200 metres short and walk the path.</p>\n<p>On foot it is a road walk, not a promenade: about 20 minutes to Lemonakia and 25 to Tsamadou at an easy pace, with no continuous pavement. Wear something visible and walk on the left, facing traffic.</p>\n<h2>Where to stay</h2>\n<p>Mulberry Residences is in Kokkari, a village with three beaches and no need for a car to reach the first one. <a href=\"?page=stays\" data-page=\"stays\">See the four stays</a> and <a href=\"?page=booking\" data-page=\"booking\">check dates</a>. For the bus, taxi and car-hire detail, read <a href=\"?page=article&amp;slug=samos-without-a-car\" data-page=\"article\" data-slug=\"samos-without-a-car\">Samos without a car</a>.</p>\n<p><em>Beach lengths, distances and facilities checked 31 October 2026 against inSamos and the Greek bathing-water registry. Sunbeds, bars and parking are seasonal; confirm locally.</em></p>"}, "kokkari-for-couples": {"slug": "kokkari-for-couples", "title": "Kokkari for couples: a village week, on foot", "description": "Why Kokkari suits two people with no car — three pebble beaches within 2 km, tavernas on the water, and what the village is honestly like in each month.", "status": "draft", "updated": "2026-10-31", "facts_verified": "partial — village, beach, distance and sea-temperature facts 31 Oct 2026; taverna names and night noise pending", "translation": "pending (Greek, German, Dutch)", "sources": ["https://in-samos.com/beaches/kokkari/", "https://in-samos.com/tsamadou/", "https://in-samos.com/beaches/lemonakia/", "https://seatemperatures.net/europe/greece/samos-island-september-temperature/", "https://www.climatestotravel.com/climate/greece/samos"], "html": "<p><strong>Short answer:</strong> Kokkari suits two people who want to swim, eat and walk without a car. Three pebble beaches sit within 2 km, the tavernas are behind the village beach, and the evening needs no taxi. It does not suit anyone who wants sand, a pool or a resort — and it is not a party village in the way some Greek islands are.</p>\n<h2>Why the village suits two</h2>\n<p>Kokkari is small enough that the geography stops being a planning problem. The village wraps around a pebble bay on the north coast: a 900-metre beach with tavernas and cafés a few steps behind it, and the older village rising behind that. You swim in the morning before the wind builds, eat lunch where you are standing, and walk to dinner.</p>\n<p>For a couple this matters more than it sounds. A week for two is mostly a rhythm, not an itinerary: coffee, a swim, a late lunch, a sleep, a walk, dinner. In Kokkari that rhythm needs no car, no parking and no booking. In a village spread along a road, it needs all three.</p>\n<p>Two more beaches are west along the coast road — Lemonakia at 1.7 km and Tsamadou at 2 km — which gives you three different swimming days without moving the car you did not hire.</p>\n<h2>The beach, before you book</h2>\n<p>This is the part to read twice, because it decides whether you will enjoy the week.</p>\n<p>Kokkari's beaches are <strong>pebble, not sand</strong>, and the water gets deep quickly. The village beach has some wave and a steady northern wind — the same wind that makes the bay a windsurfing base. It is at its best early, before the wind builds and the waterfront fills. Bring shoes you can swim in; it is the single most useful thing in the bag.</p>\n<p>The two beaches west of the village are different days, not duplicates:</p>\n<ul><li><strong>Lemonakia</strong> has the gentlest entry of the three, which makes it the beach for standing in the water rather than</li></ul>\n<p>diving into it. A 250-metre pebble beach in an open bay ringed by pines, with a restaurant, sunbeds and showers.</p>\n<ul><li><strong>Tsamadou</strong> is the largest at about 400 metres. Its shape keeps the water calm even in a north wind, and the sea</li></ul>\n<p>is cold, clear and deep, with a steep drop and a rocky floor. It is organised — sunbeds, tavernas, showers, free parking about 200 metres away — and crowded in high season. The eastern side is the island's official nudist section, which is worth knowing before you settle down for the afternoon.</p>\n<p>On foot, both are a road walk rather than a promenade: about 20 minutes to Lemonakia and 25 to Tsamadou at an easy pace, with no continuous pavement. Wear something visible, walk on the left facing traffic, or take the bus.</p>\n<h2>The week that actually works</h2>\n<p>A shape that survives real weather and real appetites:</p>\n<ul><li><strong>Morning:</strong> swim at the village beach before the wind arrives. Coffee after, not before.</li><li><strong>Midday:</strong> the second swim at Tsamadou or Lemonakia, then a long lunch.</li><li><strong>Afternoon:</strong> the wind is strongest now. Read, sleep, or drive somewhere — this is the slot for the south of</li></ul>\n<p>the island if you want the archaeological sites.</p>\n<ul><li><strong>Evening:</strong> back in the village, dinner on the water, walk home.</li></ul>\n<p>One day out is usually enough. Samos runs about 43 km from Pythagoreio in the south-east to Karlovasi in the north-west, and the mountain road makes that feel longer than the map suggests: a 30 km drive can take the better part of an hour. If you want the sites, take a car for the day rather than for the week.</p>\n<h2>When to come</h2>\n<p>The shoulder months are the argument for Kokkari over a Cycladic island, and the sea temperatures are the honest part of it:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Month</th><th>Sea</th><th>What it feels like</th></tr></thead><tbody><tr><td>May</td><td>19.5°C</td><td>Green, quiet, cheap. Bracing for the first minute, then fine</td></tr><tr><td>June</td><td>22.5°C</td><td>The best balance: warm sea, long days, not yet full</td></tr><tr><td>September</td><td>23.5°C</td><td>The warmest sea after August, with the Meltemi weakening</td></tr><tr><td>October</td><td>21.3°C</td><td>Still swimmable early in the month; rain returns and places close</td></tr></tbody></table></div>\n<p>July and August are hotter, busier and windier, with the strongest afternoon wind of the year. If swimming is the point, aim for June or September; if quiet and walking are the point, May or October.</p>\n<h2>What the studios are, and what they are not</h2>\n<p>Pyramus and Thisbe are studios: one room with a <strong>double bed</strong>, a kitchen and dining table, a bathroom, and a small outdoor table. They sleep two and no more. That is the whole promise, and it is enough for a week of the rhythm above — you are out for most of the day and you eat out most evenings.</p>\n<p>A note on the bed, because guests ask: it is two singles made up together, which is how apartments in Greece usually do a double. The room is 25 m². If you want a second bedroom, or room for four, <a href=\"?page=mulberry-lane\" data-page=\"mulberry-lane\">Mulberry Lane</a> and <a href=\"?page=mulberry-court\" data-page=\"mulberry-court\">Mulberry Court</a> are the apartments, and they cost more per night for exactly that reason.</p>\n<p>What they are not: a suite, a sea-view balcony and a resort. If the room is the holiday rather than the base, this is the wrong property, and the honest answer is to look at a hotel on the waterfront instead.</p>\n<h2>Who this is not for</h2>\n<ul><li><strong>Families with children.</strong> Not because children are unwelcome, but because a studio holds two and the village</li></ul>\n<p>beach drops away quickly. Mulberry Lane and Mulberry Court are the family options.</p>\n<ul><li><strong>Parties of three or more.</strong> One double bed, 25 m², two people.</li><li><strong>Anyone who wants sand and a pool.</strong> Neither exists here. The coast is pebble and the swimming is the sea.</li><li><strong>Anyone who needs a resort on the doorstep.</strong> Kokkari is a working village that happens to be on a beautiful bay.</li></ul>\n<h2>Getting there without a car</h2>\n<p>Samos airport is about 27 km away, 35 to 40 minutes by road. Vathy, the capital and ferry port, is 10 km and about 16 minutes. From either, a taxi is straightforward; the KTEL bus runs from Vathy to Kokkari and on to Tsamadou. Once you are in the village, the car question becomes a day-hire question, not a week-hire one.</p>\n<p><a href=\"?page=article&amp;slug=getting-to-samos\" data-page=\"article\" data-slug=\"getting-to-samos\">Getting to Samos</a> has the flights, ferries and transfer detail, and <a href=\"?page=article&amp;slug=samos-without-a-car\" data-page=\"article\" data-slug=\"samos-without-a-car\">Samos without a car</a> covers the buses, taxis and the one day a hire car earns its keep.</p>\n<h2>Where Mulberry fits</h2>\n<p>Mulberry Residences is in the village: four individual stays, two studios for two people and two apartments for four. If Kokkari is the right base for your week, <a href=\"?page=stays\" data-page=\"stays\">compare the four stays</a> and <a href=\"?page=booking\" data-page=\"booking\">check dates</a>. If it is the two of you, start with <a href=\"?page=pyramus\" data-page=\"pyramus\">Pyramus</a> or <a href=\"?page=thisbe\" data-page=\"thisbe\">Thisbe</a>.</p>\n<p><em>Beach lengths, distances and sea temperatures checked 31 October 2026. Sunbeds, bars and parking are seasonal; confirm before you travel.</em></p>"}, "samos-shoulder-season": {"slug": "samos-shoulder-season", "title": "Samos in May, June, September and October", "description": "What the shoulder season is actually like in Kokkari: sea temperatures by month, crowds, wind, what closes and when to book.", "status": "draft", "updated": "2026-10-31", "facts_verified": "2026-10-31", "translation": "pending (Greek)", "sources": ["https://seatemperatures.net/europe/greece/samos-island-september-temperature/", "https://www.climatestotravel.com/climate/greece/samos", "https://in-samos.com/beaches/lemonakia/", "https://in-samos.com/tsamadou/"], "html": "<p><strong>Short answer:</strong> The shoulder months are the best-value time to stay in Kokkari. The sea runs from about 19°C in May to 23.5°C in September and 21°C in October. The village is quieter, the light is long, and the Meltemi that defines July and August is weaker or gone. The trade-off is that some places open late, close early, or run a thinner timetable.</p>\n<h2>The months, side by side</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Month</th><th>Average sea temperature</th><th>Days</th><th>Crowds</th><th>Trade-off</th></tr></thead><tbody><tr><td>May</td><td>19.5°C</td><td>Warm, with cool evenings</td><td>Very quiet</td><td>Some tavernas and hotels still opening</td></tr><tr><td>June</td><td>22.5°C</td><td>Hot by the end of the month</td><td>Building</td><td>Wind arrives; book early for late June</td></tr><tr><td>September</td><td>23.5°C</td><td>Summer without the peak</td><td>Drops after mid-month</td><td>Some closures begin late in the month</td></tr><tr><td>October</td><td>21.3°C</td><td>Mild, rain returns</td><td>Quiet</td><td>Ferries and buses thin out; more places shut</td></tr></tbody></table></div>\n<p>Temperatures are ten-year monthly averages for the sea around Samos, not air temperatures. Air in September is typically warm rather than hot, and October is mild with the first proper rain of the autumn.</p>\n<h2>May: the island waking up</h2>\n<p>May is green, quiet and cheap. The sea is around 19.5°C — swimmable for people who do not mind a cool first minute, bracing for everyone else. Days are warm and evenings still need a layer. Wild flowers are out on the hills, the villages are unhurried, and the tavernas that open for the season are doing so through the month.</p>\n<p>If you want the island to yourself and you do not need warm water, May is the month. Check that your chosen places are open, and do not expect every beach bar to be running.</p>\n<h2>June: the best balance</h2>\n<p>June is the month most people should consider first. The sea reaches about 22.5°C, the days are long, the village is busy but not full, and the wind has not yet settled into its August rhythm. Prices are still below peak. Late June is when the season visibly starts, so book earlier than you would for May.</p>\n<h2>September: summer without the peak</h2>\n<p>September has the warmest sea after August, at about 23.5°C, and a calmer one: the Meltemi weakens, the afternoons are less windy, and the light softens. The first half of the month still feels like summer. After the middle of the month the village empties, some businesses begin to close, and the island becomes quiet again.</p>\n<p>This is the month to choose if you want warm swimming, a table without a booking, and a village that is still awake. It is also the month when the grape harvest around the island is finishing.</p>\n<h2>October: mild, quiet, changing</h2>\n<p>October sea is around 21.3°C — still swimmable, especially early in the month — and the air is mild rather than hot. Rain returns, usually as short showers rather than whole days, and the wind can turn. Tavernas and hotels close progressively through the month, ferries and buses run thinner schedules, and by the end of the month some of the village is shuttered.</p>\n<p>October suits walking, reading, and people who want the island without the season. It does not suit a beach holiday built on certainty.</p>\n<h2>Wind, walking and swimming</h2>\n<p>The Meltemi is a northern wind that blows through July and August, strongest in the afternoon. It keeps the heat bearable and makes Kokkari a windsurfing base, and it is why the beaches here are pebble and the water is rarely flat. In May, June, September and October the wind is lighter, the sea is calmer, and the coast road is a better walk.</p>\n<p>The sea is warmest in August and September, coolest in May. If swimming is the point of the trip, aim for June or September. If walking and quiet are the point, May and October.</p>\n<h2>What closes, and when</h2>\n<p>There is no single closing date. Businesses decide individually, and the pattern changes year to year. As a rule: more is open in June and September than in May and October, the last week of October is quieter than the first, and winter timetables start sometime in October. If a particular taverna or boat trip matters to you, ask before you book the flight.</p>\n<h2>Booking the shoulder months</h2>\n<p>Shoulder-season rates are lower than peak, and the calendar is more flexible: shorter minimum stays, more last-minute availability, and better odds of the unit you actually want. <a href=\"?page=booking\" data-page=\"booking\">Check dates</a> and <a href=\"?page=stays\" data-page=\"stays\">see the four stays</a>.</p>\n<p>If you are choosing between the months, <a href=\"?page=article&amp;slug=where-to-stay-samos\" data-page=\"article\" data-slug=\"where-to-stay-samos\">compare the bases</a> first, then <a href=\"?page=article&amp;slug=kokkari-beaches\" data-page=\"article\" data-slug=\"kokkari-beaches\">the beaches</a> — the swimming decision is mostly a beach decision.</p>\n<p><em>Sea temperatures are ten-year monthly averages for Samos, checked 31 October 2026. Opening dates and timetables are seasonal and local; confirm before you travel.</em></p>"}, "samos-without-a-car": {"slug": "samos-without-a-car", "title": "Samos without a car: what works from Kokkari", "description": "Buses, taxis, walking and the days a hire car earns its keep — a realistic week in Kokkari without driving.", "status": "draft", "updated": "2026-10-31", "facts_verified": "2026-10-31", "translation": "pending (Greek)", "sources": ["https://gosamos.gr/en/samos-bus-timetable-ktel", "https://www.discovergreece.com/experiences/village-hopping-samos-mountain-coast", "https://www.getfromairport.com/samos-airport/kokkari", "https://in-samos.com/tsamadou/", "https://in-samos.com/beaches/lemonakia/"], "html": "<p><strong>Short answer:</strong> A week based in Kokkari works without a car. The village, its beach and two more beaches are within 2 km, and KTEL buses connect Kokkari with Vathy five times on weekdays. You need a car, a taxi or an organised trip for the south of the island — the ancient sites, Pythagoreio and the waterfalls.</p>\n<h2>On foot</h2>\n<p>Kokkari is small. The waterfront, the tavernas, the bakery and the village beach are all within a few minutes of each other, and the older village is a short climb behind. Two more beaches lie west along the coast road: Lemonakia at 1.7 km and Tsamadou at 2 km.</p>\n<p>That road walk is not a promenade. There is no continuous pavement, the road bends, and drivers know it well. Walk on the left facing traffic, wear something visible, and take a torch if you are coming back after dark. Twenty to twenty-five minutes each way at an easy pace.</p>\n<p>For a longer walk, the lanes above the village climb towards Manolates and the mountain villages. Ask locally which route is currently clear; footpaths change with the seasons and the fires.</p>\n<h2>By bus</h2>\n<p>KTEL Samos runs the island buses. The Vathy to Kokkari and Tsamadou service left at 08:30, 09:30, 12:20, 14:00 and 17:00 on weekdays when checked in October 2026. The same route serves the coast road west of the village, so Lemonakia and Tsamadou are reachable without a car.</p>\n<p>Saturday and Sunday services are thinner, and the timetable changes with the season. The current version is posted at the KTEL office in Vathy; the phone number is +30 22730 27262. Buy your ticket from the driver.</p>\n<p>The airport bus goes to Vathy, not Kokkari. With bags, take a taxi from the airport instead.</p>\n<h2>By taxi</h2>\n<p>Taxis wait at the airport, at the Vathy quay and in Kokkari in season. For a beach run or a dinner in another village, agree a price and a return time before you set off; the driver will usually come back for you. This is the cheapest way to have one car-free evening somewhere else.</p>\n<h2>When a car earns its keep</h2>\n<p>Hire a car for two days, not seven, and only for the south and west:</p>\n<ul><li><strong>Pythagoreio, the Eupalinos tunnel and the Heraion</strong> — a full day, and the reason most people hire a car at all.</li><li><strong>Potami waterfalls and the Seitani coast</strong> — a west-coast day from Karlovasi.</li><li><strong>Manolates and the mountain villages</strong> — a half-day loop if the road is clear.</li></ul>\n<p>Hire in Vathy or at the airport, book ahead in July and August, and check whether your licence and insurance cover the mountain roads. Parking in Kokkari is at the edge of the village; the lanes are not built for cars.</p>\n<h2>A week without a car</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Day</th><th>Plan</th></tr></thead><tbody><tr><td>1</td><td>Arrive, settle in, swim at the village beach, eat on the waterfront</td></tr><tr><td>2</td><td>Walk to Lemonakia, swim, walk back; afternoon in the village</td></tr><tr><td>3</td><td>Bus to Vathy: market, museum, waterfront lunch, bus back</td></tr><tr><td>4</td><td>Hire a car: Pythagoreio, the tunnel, the Heraion, Potokaki</td></tr><tr><td>5</td><td>Walk to Tsamadou, stay for the afternoon, taxi or bus back</td></tr><tr><td>6</td><td>A second car day west, or a boat trip from Vathy, if one is running</td></tr><tr><td>7</td><td>Slow morning, last swim, transfer to the airport</td></tr></tbody></table></div>\n<h2>What you give up</h2>\n<p>Without a car you will not see the south coast properly, and you will eat in Kokkari most evenings. For a week in one village, that is a fair trade: the village is the point. If your list is archaeological sites and beaches all over the island, stay in Pythagoreio or Vathy and drive.</p>\n<h2>Where to stay</h2>\n<p>Mulberry Residences is in Kokkari, four individual stays in the village. <a href=\"?page=stays\" data-page=\"stays\">See the four stays</a> and <a href=\"?page=booking\" data-page=\"booking\">check dates</a>. For the beaches within walking distance, read <a href=\"?page=article&amp;slug=kokkari-beaches\" data-page=\"article\" data-slug=\"kokkari-beaches\">The beaches at Kokkari</a>.</p>\n<p><em>Bus times checked 31 October 2026 against the KTEL timetable published by Go Samos. Seasonal changes are normal; confirm before you rely on a departure.</em></p>"}, "where-to-stay-samos": {"slug": "where-to-stay-samos", "title": "Where to stay in Samos: Kokkari, Pythagoreio or Vathy?", "description": "A practical comparison of Samos's four bases — Kokkari, Pythagoreio, Vathy and Karlovasi — with distances, beaches and what each is best for.", "status": "draft", "updated": "2026-10-31", "facts_verified": "2026-10-31", "translation": "pending (Greek)", "sources": ["https://www.discovergreece.com/experiences/village-hopping-samos-mountain-coast", "https://in-samos.com/beaches/kokkari/", "https://in-samos.com/tsamadou/", "https://in-samos.com/beaches/lemonakia/", "https://www.in2greece.com/english/places/summer/islands/samos/samos-villages.html", "https://www.samos-island.com/destinations/eupalinos-tunnel"], "html": "<p><strong>Short answer:</strong> Kokkari for a village week with swimming and evenings on foot. Pythagoreio for the ancient sites, the airport and the beach at Potokaki. Vathy for the ferry and a working Greek town. Karlovasi only if the west coast is your plan.</p>\n<p>Samos runs about 43 km from Pythagoreio in the south-east to Karlovasi in the north-west, and the mountain road makes that distance feel longer than the map suggests. Where you sleep decides how much of the island you drive past, and how much of it you walk.</p>\n<h2>The four bases, honestly</h2>\n<h3>Kokkari — the village week</h3>\n<p>Kokkari sits on the north coast, about 10 km and 16 minutes by road from Vathy. The village wraps around a pebble bay: tavernas and cafés along the water, a 900-metre beach in front of them, and the older village rising behind. The water deepens quickly, the shore is pebble rather than sand, and the northern wind that makes the bay a windsurfing base also keeps the summer air moving.</p>\n<p>Two more beaches lie west along the coast road: Lemonakia at 1.7 km and Tsamadou at 2 km. Evenings need no taxi. This is the base for people who want to swim, eat and walk, and who accept pebbles in exchange for a village that still works in the evening.</p>\n<h3>Pythagoreio — the sites and the harbour</h3>\n<p>Pythagoreio is 20 km south of Vathy, roughly 30 minutes, and close to the airport. It is a harbour town built around a small port, with the ancient sites of the south-east on its doorstep: the Eupalinos tunnel about 2 km north, the Heraion to the west, and the long beach at Potokaki nearby — coarse sand and pebble rather than the fine sand of the Cyclades.</p>\n<p>It is the busier, more hotel-heavy base. That suits a first visit with a hire car and a list of archaeological sites. It suits less if you want quiet evenings and a village you can cross on foot in ten minutes.</p>\n<h3>Vathy — the ferry port</h3>\n<p>Vathy is the capital and the main port, where the Piraeus ferries arrive after 8 to 11 hours at sea. It is a town rather than a resort: a waterfront, a museum, shops, wine bars, and traffic. Useful for a night before or after a ferry, and a practical place to hire a car. Not the base for a swimming holiday.</p>\n<h3>Karlovasi — the west</h3>\n<p>Karlovasi is 32 km from Vathy and 37 km from the airport, on the north-west coast. It is a university town and the second ferry port, and the base for the Potami waterfalls and the protected Seitani coast. Choose it if the west is your itinerary; it is a long way from everything else.</p>\n<h2>At a glance</h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Base</th><th>From Vathy</th><th>Beach</th><th>Evenings</th><th>Best for</th></tr></thead><tbody><tr><td>Kokkari</td><td>10 km, 16 min</td><td>Pebble bay; two more beaches within 2 km</td><td>Tavernas on the water, on foot</td><td>Couples, swimmers, walkers, a week in one place</td></tr><tr><td>Pythagoreio</td><td>20 km, 30 min</td><td>Coarse sand and pebble at Potokaki; harbour swimming</td><td>Harbour restaurants, busier</td><td>First visits, ancient sites, airport arrivals</td></tr><tr><td>Vathy</td><td>—</td><td>Town beach, not the reason to stay</td><td>Waterfront, shops, wine</td><td>Ferry arrivals, one-night stops</td></tr><tr><td>Karlovasi</td><td>32 km</td><td>Small town beaches</td><td>Student town</td><td>West coast, waterfalls, Seitani</td></tr></tbody></table></div>\n<h2>How the choice changes your week</h2>\n<ul><li><strong>Kokkari:</strong> swim before breakfast, walk to two more beaches, eat in the village, drive only when you want the south.</li><li><strong>Pythagoreio:</strong> drive to sites in the morning, swim at Potokaki in the afternoon, eat in the harbour.</li><li><strong>Vathy:</strong> arrive, sleep, collect a car, leave. Or use it as a ferry-day base at either end of a trip.</li></ul>\n<p>Distances on Samos are short but slow. The road from the north coast to the south-east crosses the island's spine, and a 30 km drive can take the better part of an hour. Pick the base that matches the days you actually want, not the list of places you might visit.</p>\n<h2>Where Mulberry fits</h2>\n<p>Mulberry Residences is in Kokkari: four individual stays — Pyramus Studio, Thisbe Studio, Mulberry Lane and Mulberry Court. Two are studios and two are residences, each with its own page and its own verified details. If Kokkari is the right base for your week, <a href=\"?page=stays\" data-page=\"stays\">see the four stays</a> and <a href=\"?page=booking\" data-page=\"booking\">check dates</a>.</p>\n<h2>Questions people ask</h2>\n<p><strong>Is Kokkari or Pythagoreio better for a first visit?</strong> If you came for the archaeological sites and sandy swimming, Pythagoreio. If you came for a village, a bay and evenings on foot, Kokkari. Both work for a first week; they produce different holidays.</p>\n<p><strong>Do you need a car in Kokkari?</strong> Not for the village and its beaches. <a href=\"?page=article&amp;slug=samos-without-a-car\" data-page=\"article\" data-slug=\"samos-without-a-car\">Samos without a car</a> covers the buses, taxis and the days a car is worth hiring.</p>\n<p><strong>How far is Kokkari from the airport?</strong> About 27 km, roughly 35 to 40 minutes by road. <a href=\"?page=article&amp;slug=getting-to-samos\" data-page=\"article\" data-slug=\"getting-to-samos\">Getting to Samos</a> has the transfer options.</p>\n<p><strong>Which beaches are near Kokkari?</strong> The village beach, Lemonakia and Tsamadou, all within 2 km. <a href=\"?page=article&amp;slug=kokkari-beaches\" data-page=\"article\" data-slug=\"kokkari-beaches\">The beaches at Kokkari</a> compares them.</p>\n<p><em>Distances and travel times checked 31 October 2026 against Discover Greece and inSamos. Roads, bus times and opening dates change; confirm before you travel.</em></p>"}, "working-from-samos": {"slug": "working-from-samos", "title": "Working from Samos: what the internet is actually like", "description": "A practical guide to remote work in Kokkari: shared Starlink, the bedroom desk at Mulberry Court, upload and latency, and what to check before you book a call-critical trip.", "status": "draft", "updated": "2026-10-31", "facts_verified": "2026-10-31", "translation": "pending (Greek)", "sources": ["https://www.starlink.com/legal/documents/DOC-1470-99699-90", "https://www.starlink.com/residential"], "html": "<p><strong>Short answer:</strong> the four apartments share one Starlink connection, distributed through a five-node mesh. It is good enough for video calls, file transfer and streaming when it is working well, but it is not fibre and it is not a guarantee. We do not publish a speed figure, because the connection is shared and the number changes with weather, load and how many guests are online. If you need a desk, book <strong>Mulberry Court</strong>: the bedroom has one.</p>\n<h2>The setup</h2>\n<p>Starlink comes into the property through a single dish and router. A five-node Deco mesh carries the signal across the four apartments. Guests use a separate guest network, not the apartment systems or the host's devices.</p>\n<p>The connection is shared. One apartment running a backup or a long video call affects the others. That is normal for a small property, but it is the reason not to quote a single speed test as if it were yours for the week.</p>\n<h2>The desk</h2>\n<p>Mulberry Court has a desk in the bedroom. It is the most practical unit if you need to work from the apartment: a door you can close, a surface for a laptop, and power nearby.</p>\n<p>The two studios are a simpler base. Do not assume a desk in Pyramus or Thisbe until it is confirmed; if the work is the main reason for the trip, ask before you book.</p>\n<h2>What matters more than a download number</h2>\n<ul><li><strong>Upload</strong> decides whether your camera, screen share and cloud backup work. A fast download line with a weak upload can still struggle on a group call.</li><li><strong>Latency and jitter</strong> decide whether the call feels natural. Starlink is low-orbit, so it is much better than older satellite, but it is not a fibre circuit.</li><li><strong>Packet loss</strong> decides whether the call drops. A speed test can look fine while the call stutters.</li><li><strong>Other guests</strong> share the connection. A single test at 09:00 does not describe the apartment at 21:00.</li><li><strong>A wired connection</strong>, where fitted, removes one source of variation. Ask whether the unit has Ethernet at the desk.</li></ul>\n<h2>What Starlink is, and what it is not</h2>\n<p>Starlink is a satellite service. It needs a clear view of the sky, mains power and a router. Heavy rain, snow or a blocked dish can reduce performance. It is not fibre, and it is not immune to congestion.</p>\n<p>It is also not \"off-grid\". Kokkari is a working village with mains power, tavernas and a beach. The appeal is the village, not a cabin in the mountains.</p>\n<h2>Before you book a call-critical trip</h2>\n<p>1. Tell us what you need: video calls, large uploads, a live stream, or ordinary email and browsing. 2. Ask whether Mulberry Court is available if you need the desk. 3. Ask whether a 4G/5G backup is live for your dates. We will only advertise it once it is installed and tested. 4. Bring a wired adapter if your laptop has no Ethernet port, if the unit has Ethernet at the desk. 5. If the work is the main reason for the trip, book Mulberry Court rather than the smallest studio.</p>\n<h2>Which unit for a working week</h2>\n<p><strong>Mulberry Court</strong> has the bedroom desk. The two residences are Mulberry Court and Mulberry Lane; the studios are Pyramus and Thisbe. The studios suit one or two people who want a simple base and will work from a laptop at the table.</p>\n<p><a href=\"?page=stays\" data-page=\"stays\">Compare the four stays</a> and <a href=\"?page=booking\" data-page=\"booking\">check dates</a>. If you are choosing a month, <a href=\"?page=article&amp;slug=samos-shoulder-season\" data-page=\"article\" data-slug=\"samos-shoulder-season\">the shoulder-season guide</a> explains when the village is quiet, what is open, and what the sea is doing. <a href=\"?page=article&amp;slug=where-to-stay-samos\" data-page=\"article\" data-slug=\"where-to-stay-samos\">Where to stay in Samos</a> compares Kokkari with the other bases.</p>\n<h2>What we will not claim</h2>\n<ul><li>We will not publish a speed figure. The connection is shared.</li><li>We will not call it fibre.</li><li>We will not call the property off-grid.</li><li>We will not claim a desk in a unit that does not have one.</li></ul>\n<p><em>Starlink performance varies with weather, load and the installation. Last general review: 31 October 2026.</em></p>"}}; window.BEFORE_AFTER={"status": "owner direction 2 Nov 2026: use the Playbook Olive Grove / Vineyard Retreat renders as the after images; the per-room Image Book render set differed from the intended renovation and is retired from the site (extraction repeatable from The Kantouni Image Book.html)", "pairs": [{"unit": "mulberry-lane", "room": "The whole home", "roomSlug": "whole-home", "before": "assets/before-after/mulberry-lane-before.webp", "after": "assets/before-after/mulberry-lane-after.webp", "altBefore": "Before: Mulberry Lane — photographs of the apartment before the renovation", "altAfter": "After: AI impression of the planned renovation of Mulberry Lane in the Olive Grove / Vineyard Retreat theme", "before_size": [1200, 800], "after_size": [1200, 800]}, {"unit": "thisbe", "room": "The whole home", "roomSlug": "whole-home", "before": "assets/before-after/thisbe-before.webp", "after": "assets/before-after/thisbe-after.webp", "altBefore": "Before: Thisbe Studio — photographs of the apartment before the renovation", "altAfter": "After: AI impression of the planned renovation of Thisbe Studio in the Olive Grove / Vineyard Retreat theme", "before_size": [1200, 800], "after_size": [1200, 800]}, {"unit": "pyramus", "room": "The whole home", "roomSlug": "whole-home", "before": "assets/before-after/pyramus-before.webp", "after": "assets/before-after/pyramus-after.webp", "altBefore": "Before: Pyramus Studio — photographs of the apartment before the renovation", "altAfter": "After: AI impression of the planned renovation of Pyramus Studio in the Olive Grove / Vineyard Retreat theme", "before_size": [1200, 800], "after_size": [1200, 800]}, {"unit": "mulberry-court", "room": "The whole home", "roomSlug": "whole-home", "before": "assets/before-after/mulberry-court-before.webp", "after": "assets/before-after/mulberry-court-after.webp", "altBefore": "Before: Mulberry Court — photographs of the apartment before the renovation", "altAfter": "After: AI impression of the planned renovation of Mulberry Court in the Olive Grove / Vineyard Retreat theme — with the wine and terracotta accents", "before_size": [1200, 800], "after_size": [1200, 800]}], "scopeNotes": {"source": "The Kantouni Playbook.html — per-unit \"Original photos\" sheets and \"AI render\" collages in the Olive Grove / Vineyard Retreat theme", "disclaimer": "AI renders are illustrations, not guarantees of finish, layout or cost - confirm everything on site and in the master."}};

booking link will appear here once configured and tested.</small></div><p class="note">No card details, guest names or email addresses are collected in this prototype.</p>${link('contact','Contact & location '+arrow(),'text-link')}</aside></div>`;

function bindBooking(){const form=document.getElementById('booking-form');if(!form)return;
 function remember(){const f=new FormData(form);selection={home:f.get('home'),arrival:f.get('arrival'),departure:f.get('departure'),guests:f.get('guests')};}
 form.addEventListener('input',()=>{remember();document.getElementById('booking-result').hidden=true;});
 form.addEventListener('submit',e=>{e.preventDefault();remember();const error=document.getElementById('booking-error');const result=document.getElementById('booking-result');let message='',field='';const min=document.getElementById('arrival').min;
 if(!selection.arrival){message='Choose an arrival date to continue.';field='arrival';}
 else if(selection.arrival<min){message='Choose an arrival date today or later.';field='arrival';}
 else if(!selection.departure||selection.departure<=selection.arrival){message='Choose a departure date after your arrival.';field='departure';}
 else if(!Number.isInteger(Number(selection.guests))||Number(selection.guests)<1){message='Enter a whole number of guests, starting at 1.';field='guests';}
 form.querySelectorAll('[aria-invalid]').forEach(el=>{el.removeAttribute('aria-invalid');el.removeAttribute('aria-errormessage');});
 if(message){error.textContent=message;error.hidden=false;result.hidden=true;const f=document.getElementById(field);f.setAttribute('aria-invalid','true');f.setAttribute('aria-errormessage','booking-error');f.focus();return;}
 error.hidden=true;const homeName=homes.find(h=>h.id===selection.home)?.name||'All four stays';const nights=Math.round((new Date(selection.departure+'T00:00:00Z')-new Date(selection.arrival+'T00:00:00Z'))/86400000);const date=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
 result.innerHTML=`<h2>Your stay, at a glance.</h2><p class="summary">${escapeHTML(homeName)}<br>${date(selection.arrival)} – ${date(selection.departure)}<br>${nights} ${nights===1?'night':'nights'} · ${escapeHTML(selection.guests)} ${selection.guests==='1'?'guest':'guests'}</p><p><strong>Preview only. Availability has not been checked.</strong></p><p>The finished site will show the booking provider's availability, total price and terms. No reservation has been created, and these dates have not been sent anywhere.</p>`;result.hidden=false;result.focus();
 });
}

function beforeAfterSection(unit){const p=BA.pairs.find(x=>x.unit===unit.id);if(!p)return '';
 return `<section class="ba-section wrap"><h2>Before &amp; after:<br><span>the ${unit.name} refresh.</span></h2><p class="ba-intro">The "after" image is an AI impression of the planned renovation — our Olive Grove / Vineyard Retreat direction from the design playbook — not a photograph of a finished room.</p><div class="ba-imgs">${baFig(p.before,p.altBefore,p.before_size,'Before','ba-before')}${baFig(p.after,p.altAfter,p.after_size,'After · planned','ba-after')}</div><p class="ba-note">Every home is being refreshed ahead of the coming season. Dates and rates follow soon — write to hello@mulberrysamos.com and we will tell you where each home stands.</p></section>`;}
function enquirySection(){return `<section class="enquiry-section"><div class="section-narrow enquiry-layout"><div><h2>Questions about<br><span>your stay?</span></h2><p>Tell us which home you have in mind and what you would like to know.</p><p class="enquiry-note">Sent straight to <b>hello@mulberrysamos.com</b> — we reply personally.<br>We only use your details to answer your enquiry.</p></div><form id="enquiry-form"><input type="hidden" name="_subject" value="Enquiry from mulberrysamos.com"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><label class="hp" aria-hidden="true">Leave empty<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label><div class="enquiry-fields"><label>Your name<input name="name" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label></div><label>Your preferred home<select name="home"><option>Not sure yet</option>${homes.map(h=>`<option>${h.name}</option>`).join('')}</select></label><label>Your message<textarea name="message" rows="3" required></textarea></label><button class="button light" type="submit">Send enquiry ${arrow()}</button><p class="enquiry-result" role="status" hidden></p></form></div></section>`;}
function propertyPage(h){const covers={'pyramus':0,'thisbe':0,'mulberry-lane':0,'mulberry-court':0};return `<section class="page-heading wrap">${link('stays','Our stays /','breadcrumb')}<div class="property-title"><div><h1>${h.name}</h1><p>${h.type} · Mulberry Residences · Kokkari, Samos</p></div><span class="status-label">Pre-renovation photos · renovation impressions below</span></div></section><div class="property-layout wrap"><div><figure class="property-main-image">${photoButton(h.id,covers[h.id])}</figure><div class="gallery-thumbs">${[1,2,3].map(i=>photoButton(h.id,i)).join('')}</div><p class="quiet-note">Pre-renovation photographs · select an image to open the complete gallery</p></div><section class="property-details"><h2>A closer look<br>at ${h.name}.</h2><p>Explore this home's existing photographs while we prepare the full property details and the professional shoot.</p><dl class="facts"><div><dt>Location</dt><dd>Kokkari, Samos</dd></div><div><dt>Guests & beds</dt><dd>To be confirmed</dd></div><div><dt>Amenities</dt><dd>To be confirmed</dd></div><div><dt>Rates & availability</dt><dd>Not live yet</dd></div></dl>${link('booking','Choose dates for this stay '+arrow(),'button',{home:h.id})}<small>Preview only · no reservation will be made</small></section></div>${beforeAfterSection(h)}<section class="wrap"><div class="details-section"><h2>Before you choose your stay</h2><details><summary>About these photographs</summary><p>These photographs show the apartment before the renovation. They do not confirm the current amenities, occupancy, access arrangements or included services. Below, before and after impressions show what we are changing.</p></details><details><summary>How will booking work?</summary><p>The finished website will connect to Smoobu for this home's availability, prices and reservation confirmation. The booking journey here is a preview only.</p></details><details><summary>Arrival, house rules and cancellation</summary><p>Verified arrival information, capacity, house rules and booking policies will be added before live reservations.</p></details></div></section>${closing()}`;}
function renderViewer(){const entry=viewing[viewerIndex];const p=PHOTOS[entry.id][entry.i];document.querySelector('.viewer-photo').innerHTML=photo(entry.id,entry.i);document.getElementById('photo-caption').textContent=`${homeById(entry.id).name} · ${p.alt} · ${viewerIndex+1} / ${viewing.length}`;}
function openPhoto(id,i,trigger){viewing=PHOTOS[id].map((p,index)=>({id,i:index}));viewerIndex=i;photoTrigger=trigger;renderViewer();document.getElementById('photo-dialog').showModal();document.querySelector('.photo-close').focus();}
function bindReference(){const f=document.getElementById('enquiry-form');if(!f)return;
 const result=f.querySelector('.enquiry-result');const button=f.querySelector('button[type=submit]');
 const label=button.innerHTML;
 f.addEventListener('submit',e=>{e.preventDefault();
  if(f.querySelector('[name=_honey]').value){result.textContent='Thank you — your enquiry has been received.';result.hidden=false;f.reset();return;}
  const data=Object.fromEntries(new FormData(f).entries());
  button.disabled=true;button.textContent='Sending…';
  fetch('https://formsubmit.co/ajax/hello@mulberrysamos.com',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({...data,_subject:'Enquiry from mulberrysamos.com',_template:'table',_captcha:'false'})})
   .then(r=>{if(!r.ok)throw Error('http '+r.status);return r.json();})
   .then(res=>{if(!res||String(res.success)!=='true')throw Error('rejected');
    result.textContent=`Thank you${data.name?', '+data.name.split(' ')[0]:''} — your enquiry is on its way to hello@mulberrysamos.com. We will reply to ${data.email}.`;f.reset();})
   .catch(()=>{result.textContent='That did not go through. Please email hello@mulberrysamos.com directly and we will pick it up there.';})
   .finally(()=>{button.disabled=false;button.innerHTML=label;result.hidden=false;});
 });}
document.addEventListener('click',e=>{const p=e.target.closest('[data-photo-home]');if(p)openPhoto(p.dataset.photoHome,Number(p.dataset.photoIndex),p);const filter=e.target.closest('[data-gallery]');if(filter){galleryFilter=filter.dataset.gallery;document.querySelectorAll('[data-gallery]').forEach(b=>b.setAttribute('aria-pressed',String(b===filter)));document.getElementById('gallery-grid').innerHTML=galleryMarkup();}});
const photoDialog=document.getElementById('photo-dialog');
document.querySelector('.photo-close').onclick=()=>photoDialog.close();
document.querySelector('.photo-prev').onclick=()=>{viewerIndex=(viewerIndex-1+viewing.length)%viewing.length;renderViewer();};
document.querySelector('.photo-next').onclick=()=>{viewerIndex=(viewerIndex+1)%viewing.length;renderViewer();};
photoDialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();viewerIndex=(viewerIndex+(e.key==='ArrowRight'?1:-1)+viewing.length)%viewing.length;renderViewer();}});
photoDialog.addEventListener('close',()=>photoTrigger?.focus());

render();</script>
</body></html>
